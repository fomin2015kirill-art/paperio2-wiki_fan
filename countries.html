<title>Countries — Paper.io 2 Wiki Fan</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    text-align:center;
}

header{
    background:#080808;
    padding:25px 15px;
    border-bottom:2px solid #00ff66;
    box-shadow:0 0 20px #00ff6633;
}

header h1{
    margin:0;
    color:#00ff66;
    text-shadow:0 0 10px #00ff66;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.info{
    background:#0b0b0b;
    border:1px solid #00ff66;
    border-radius:15px;
    padding:18px;
    margin-bottom:20px;
}

.info p{
    color:#ccc;
    font-size:17px;
}

.countries{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.country{
    background:#0b0b0b;
    border:1px solid #00ff66;
    border-radius:12px;
    padding:15px 10px;
    color:#00ff66;
    font-weight:bold;
    box-shadow:0 0 8px #00ff6618;
    transition:0.2s;
}

.country:hover{
    transform:translateY(-3px);
    box-shadow:0 0 15px #00ff6655;
}

.back{
    display:inline-block;
    margin-top:25px;
    padding:13px 22px;
    background:#00ff66;
    color:#000;
    text-decoration:none;
    font-weight:bold;
    border-radius:10px;
}

.back:hover{
    background:#00cc52;
    box-shadow:0 0 15px #00ff66;
}
</style>
</head>

function applyLanguage(language){

    const t = translations[language] || translations.en;

    document.getElementById("title").textContent = t.title;
    document.getElementById("description").textContent = t.description;
    document.getElementById("back").textContent = t.back;

    document.documentElement.lang = language;
}

    language = "en";
    localStorage.setItem("siteLanguage","en");
}

const container = document.getElementById("countries");
