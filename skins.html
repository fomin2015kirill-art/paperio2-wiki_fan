

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skins — Paper.io 2 Wiki Fan</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    text-align:center;
}

header{
    background:#080808;
    padding:25px 15px;
    border-bottom:2px solid #00ff66;
    box-shadow:0 0 20px #00ff6633;
}

header h1{
    margin:0;
    color:#00ff66;
    text-shadow:0 0 10px #00ff66;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.skin{
    background:#0b0b0b;
    border:1px solid #00ff66;
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 0 10px #00ff6618;
}

.skin:hover{
    transform:translateY(-2px);
    box-shadow:0 0 18px #00ff6644;
    transition:0.2s;
}

.skin h2{
    margin:0 0 8px;
    color:#00ff66;
}

.skin p{
    color:#ccc;
    line-height:1.5;
}

.back{
    display:inline-block;
    margin-top:10px;
    padding:13px 22px;
    background:#00ff66;
    color:#000;
    text-decoration:none;
    font-weight:bold;
    border-radius:10px;
}

.back:hover{
    background:#00cc52;
    box-shadow:0 0 15px #00ff66;
}

</style>
</head>

<body>

<header>
    <h1 id="title">👤 Skins</h1>
</header>

<div class="container">

    <div class="skin">
        <h2>🐄 Cow</h2>
        <p id="cow">One of the popular Paper.io 2 skins.</p>
    </div>

    <div class="skin">
        <h2>🦀 Crab</h2>
        <p id="crab">A funny crab character.</p>
    </div>

    <div class="skin">
        <h2>🍒 Cherry</h2>
        <p id="cherry">A cherry-themed character.</p>
    </div>

    <div class="skin">
        <h2>🚤 Skipper</h2>
        <p id="skipper">One of the favorite skins of many players.</p>
    </div>

    <a class="back" id="back" href="index.html">
        🏠 Home
    </a>

</div>

<script>

const translations = {

    en:{
        title:"👤 Skins",
        cow:"One of the popular Paper.io 2 skins.",
        crab:"A funny crab character.",
        cherry:"A cherry-themed character.",
        skipper:"One of the favorite skins of many players.",
        back:"🏠 Home"
    },

    ru:{
        title:"👤 Скины",
        cow:"Один из популярных скинов Paper.io 2.",
        crab:"Забавный персонаж-краб.",
        cherry:"Персонаж в стиле вишни.",
        skipper:"Один из любимых скинов многих игроков.",
        back:"🏠 На главную"
    },

    uk:{
        title:"👤 Скіни",
        cow:"Один із популярних скінів Paper.io 2.",
        crab:"Кумедний персонаж-краб.",
        cherry:"Персонаж у стилі вишні.",
        skipper:"Один із улюблених скінів багатьох гравців.",
        back:"🏠 На головну"
    }

};


function applyLanguage(language){

    const t = translations[language] || translations.en;

    document.getElementById("title").textContent = t.title;
    document.getElementById("cow").textContent = t.cow;
    document.getElementById("crab").textContent = t.crab;
    document.getElementById("cherry").textContent = t.cherry;
    document.getElementById("skipper").textContent = t.skipper;
    document.getElementById("back").textContent = t.back;

    document.documentElement.lang = language;
}


/* Берём язык из настроек */

let language = localStorage.getItem("siteLanguage");

if(!language){
    language = "en";
    localStorage.setItem("siteLanguage","en");
}

applyLanguage(language);

</script>

</body>
  </html>
