<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paper.io 2 Wiki Fan</title>

<style>

/* =========================
   ОСНОВА
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:#030303;
    color:white;

    font-family:Arial,sans-serif;
    text-align:center;

    overflow-x:hidden;
}


/* =========================
   ВЕРХ САЙТА
========================= */

header{

    background:#080808;

    padding:24px 15px;

    border-bottom:2px solid #00ff66;

    box-shadow:
        0 0 20px #00ff6633;
}

header h1{

    margin:0;

    color:#00ff66;

    font-size:30px;

    text-shadow:
        0 0 10px #00ff66;
}


/* =========================
   СЕКРЕТНАЯ ПАСХАЛКА
========================= */

.secret{

    width:90%;

    max-width:700px;

    margin:40px auto;

    padding:35px 20px;

    background:
        radial-gradient(
            circle,
            #180000 0%,
            #090909 55%,
            #020202 100%
        );

    border:2px solid #ff2222;

    border-radius:20px;

    box-shadow:
        0 0 20px #ff000044,
        inset 0 0 30px #ff000011;
}


/* =========================
   МАСКИ
========================= */

.masks{

    font-size:65px;

    letter-spacing:8px;

    margin-bottom:15px;

    filter:
        drop-shadow(
            0 0 15px #00ff66
        );

}


/* =========================
   СЕКРЕТНЫЙ ЗАГОЛОВОК
========================= */

.secret h2{

    margin:10px 0;

    color:#ff2222;

    font-family:monospace;

    font-size:31px;

    text-shadow:
        0 0 10px red,
        0 0 25px red;

    animation:glitch 2s infinite;
}


/* =========================
   ПОДЗАГОЛОВОК
========================= */

.secret h3{

    color:#00ff66;

    font-family:monospace;

    font-size:21px;

    text-shadow:
        0 0 10px #00ff66;
}


/* =========================
   ИНФОРМАЦИЯ
========================= */

.info{

    margin:25px auto;

    padding:18px;

    max-width:500px;

    background:#050505;

    border:1px solid #ff2222;

    border-radius:12px;

    color:#aaa;

    font-family:monospace;

    line-height:2;
}


/* =========================
   КНОПКА
========================= */

.download{

    display:inline-block;

    margin-top:10px;

    padding:16px 25px;

    background:#100000;

    color:#ff2222;

    border:2px solid #ff2222;

    border-radius:12px;

    text-decoration:none;

    font-family:monospace;

    font-size:18px;

    transition:0.3s;

    cursor:pointer;
}

.download:hover{

    background:#ff2222;

    color:#000;

    box-shadow:
        0 0 25px #ff2222;

    transform:scale(1.05);
}

.download:active{

    transform:scale(0.95);
}


/* =========================
   НИЖНЯЯ НАДПИСЬ
========================= */

.warning{

    margin-top:25px;

    color:#555;

    font-family:monospace;

    font-size:13px;
}


/* =========================
   GLITCH
========================= */

@keyframes glitch{

    0%,90%,100%{
        transform:translateX(0);
    }

    92%{
        transform:translateX(-4px);
    }

    94%{
        transform:translateX(4px);
    }

    96%{
        transform:translateX(-2px);
    }

}


/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media(max-width:500px){

    header h1{
        font-size:25px;
    }

    .secret{
        margin-top:30px;
        padding:30px 15px;
    }

    .masks{
        font-size:50px;
    }

    .secret h2{
        font-size:25px;
    }

    .secret h3{
        font-size:18px;
    }

}

</style>

</head>


<body>
