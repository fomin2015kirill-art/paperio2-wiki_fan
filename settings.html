<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings — Paper.io 2 Wiki Fan</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    text-align:center;
}

header{
    background:#080808;
    padding:25px 15px;
    border-bottom:2px solid #00ff66;
    box-shadow:0 0 20px #00ff6633;
}

header h1{
    margin:0;
    color:#00ff66;
    text-shadow:0 0 10px #00ff66;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.setting{
    background:#0b0b0b;
    border:1px solid #00ff66;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:0 0 15px #00ff6618;
}

.setting h2{
    color:#00ff66;
    margin-top:0;
}

.languages{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}

.language{
    padding:15px;

    border:2px solid #00ff66;

    background:#050505;

    color:#00ff66;

    border-radius:12px;

    cursor:pointer;

    font-size:17px;

    font-weight:bold;

    transition:0.2s;
}

.language:hover{
    transform:scale(1.02);
}

.language.active{
    background:#00ff66;
    color:#000;
    box-shadow:0 0 15px #00ff66;
}

.back{
    display:inline-block;

    margin-top:20px;

    padding:13px 22px;

    background:#00ff66;

    color:#000;

    text-decoration:none;

    font-weight:bold;

    border-radius:10px;
}

.back:hover{
    background:#00cc52;

    box-shadow:0 0 15px #00ff66;
}

</style>

</head>


<body>


<header>

<h1 id="title">
⚙️ Settings
</h1>

</header>


<div class="container">


<div class="setting">

<h2 id="languageTitle">
🌐 Language
</h2>


<div class="languages">


<button
class="language"
data-language="ru"
onclick="changeLanguage('ru')">

🇷🇺 Русский

</button>


<button
class="language"
data-language="en"
onclick="changeLanguage('en')">

🇬🇧 English

</button>


<button
class="language"
data-language="uk"
onclick="changeLanguage('uk')">

🇺🇦 Українська

</button>


</div>

</div>


<a
class="back"
id="backButton"
href="index.html">

🏠 Home

</a>


</div>


<script>

/* =================================
   🌐 ЯЗЫКИ
================================= */

const translations = {

en:{
    title:"⚙️ Settings",
    language:"🌐 Language",
    back:"🏠 Home"
},

ru:{
    title:"⚙️ Настройки",
    language:"🌐 Язык",
    back:"🏠 На главную"
},

uk:{
    title:"⚙️ Налаштування",
    language:"🌐 Мова",
    back:"🏠 На головну"
}

};


/* =================================
   🔐 КЛЮЧ ЯЗЫКА
================================= */

const LANGUAGE_KEY = "siteLanguage";


/* =================================
   🌐 ПОЛУЧИТЬ ЯЗЫК
================================= */

function getLanguage(){

    let language =
        localStorage.getItem(LANGUAGE_KEY);


    if(
        language !== "ru" &&
        language !== "en" &&
        language !== "uk"
    ){

        language = "en";

        localStorage.setItem(
            LANGUAGE_KEY,
            language
        );

    }


    return language;

}


/* =================================
   🌐 ПРИМЕНИТЬ ЯЗЫК
================================= */

function applyLanguage(language){

    const data =
        translations[language] ||
        translations.en;


    document.getElementById("title")
        .textContent = data.title;


    document.getElementById("languageTitle")
        .textContent = data.language;


    document.getElementById("backButton")
        .textContent = data.back;


    document.documentElement.lang =
        language;


    /* Активная кнопка */

    document.querySelectorAll(
        ".language"
    ).forEach(function(button){

        button.classList.remove("active");


        if(
            button.dataset.language ===
            language
        ){

            button.classList.add("active");

        }

    });

}


/* =================================
   🔄 СМЕНА ЯЗЫКА
================================= */

function changeLanguage(language){

    /* Сохраняем */

    localStorage.setItem(
        LANGUAGE_KEY,
        language
    );


    /* Применяем здесь */

    applyLanguage(language);


    /* Сообщаем другим страницам */

    window.dispatchEvent(
        new CustomEvent(
            "languageChanged",
            {
                detail:{
                    language:language
                }
            }
        )
    );

}


/* =================================
   🚀 ПЕРВЫЙ ЗАПУСК
================================= */

const savedLanguage =
    getLanguage();


applyLanguage(
    savedLanguage
);


/* =================================
   🔄 ЕСЛИ СТРАНИЦА ВЕРНУЛАСЬ НАЗАД
================================= */

window.addEventListener(
    "pageshow",
    function(){

        applyLanguage(
            getLanguage()
        );

    }
);


/* =================================
   🌐 ИЗМЕНЕНИЕ ИЗ ДРУГОЙ ВКЛАДКИ
================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === LANGUAGE_KEY
        ){

            applyLanguage(
                getLanguage()
            );

        }

    }
);

</script>


</body>

    </html>
