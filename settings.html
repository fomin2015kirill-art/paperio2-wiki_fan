<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings — Paper.io 2 Wiki Fan</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    text-align:center;
}

header{
    background:#080808;
    padding:25px 15px;
    border-bottom:2px solid #00ff66;
    box-shadow:0 0 20px #00ff6633;
}

header h1{
    margin:0;
    color:#00ff66;
    text-shadow:0 0 10px #00ff66;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.setting{
    background:#0b0b0b;
    border:1px solid #00ff66;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:0 0 15px #00ff6618;
}

.setting h2{
    color:#00ff66;
    margin-top:0;
}

.languages{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}

.language{
    padding:15px;
    border:2px solid #00ff66;
    background:#050505;
    color:#00ff66;
    border-radius:12px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
}

.language:hover,
.language.active{
    background:#00ff66;
    color:#000;
    box-shadow:0 0 15px #00ff66;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:13px 22px;
    background:#00ff66;
    color:#000;
    text-decoration:none;
    font-weight:bold;
    border-radius:10px;
}

.back:hover{
    background:#00cc52;
    box-shadow:0 0 15px #00ff66;
}

</style>
</head>

<body>

<header>
    <h1 id="title">⚙️ Settings</h1>
</header>

<div class="container">

    <div class="setting">

        <h2 id="languageTitle">🌐 Language</h2>

        <div class="languages">

            <button class="language" onclick="changeLanguage('ru', this)">
                🇷🇺 Русский
            </button>

            <button class="language" onclick="changeLanguage('en', this)">
                🇬🇧 English
            </button>

            <button class="language" onclick="changeLanguage('uk', this)">
                🇺🇦 Українська
            </button>

        </div>

    </div>

    <a class="back" id="backButton" href="index.html">
        🏠 Home
    </a>

</div>

<script>

const translations = {

    en:{
        title:"⚙️ Settings",
        language:"🌐 Language",
        back:"🏠 Home"
    },

    ru:{
        title:"⚙️ Настройки",
        language:"🌐 Язык",
        back:"🏠 На главную"
    },

    uk:{
        title:"⚙️ Налаштування",
        language:"🌐 Мова",
        back:"🏠 На головну"
    }

};


function changeLanguage(language, button){

    /* Сохраняем выбранный язык */

    localStorage.setItem("siteLanguage", language);

    /* Меняем текст */

    applyLanguage(language);

    /* Меняем активную кнопку */

    document.querySelectorAll(".language").forEach(function(btn){
        btn.classList.remove("active");
    });

    button.classList.add("active");
}


function applyLanguage(language){

    const data = translations[language];

    document.getElementById("title").textContent = data.title;

    document.getElementById("languageTitle").textContent = data.language;

    document.getElementById("backButton").textContent = data.back;
}


/* При первом входе язык = English */

let savedLanguage = localStorage.getItem("siteLanguage");

if(!savedLanguage){

    savedLanguage = "en";

    localStorage.setItem("siteLanguage","en");
}


/* Показываем сохранённый язык */

applyLanguage(savedLanguage);


/* Показываем выбранную кнопку */

document.querySelectorAll(".language").forEach(function(button){

    if(
        (savedLanguage === "ru" && button.textContent.includes("Русский")) ||
        (savedLanguage === "en" && button.textContent.includes("English")) ||
        (savedLanguage === "uk" && button.textContent.includes("Українська"))
    ){

        button.classList.add("active");

    }

});

</script>

</body>
</html>
