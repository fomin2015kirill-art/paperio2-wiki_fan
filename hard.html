<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hard — Paper.io 2 Wiki Fan</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    text-align:center;
}

header{
    background:#080808;
    padding:25px 15px;
    border-bottom:2px solid #ff6600;
    box-shadow:0 0 20px #ff660033;
}

header h1{
    margin:0;
    color:#ff6600;
    font-size:30px;
    text-shadow:0 0 10px #ff6600;
}

.container{
    max-width:750px;
    margin:25px auto;
    padding:20px;
}

.subtitle{
    color:#ccc;
    font-size:18px;
    margin-bottom:25px;
}

.achievement{
    display:flex;
    align-items:center;
    gap:15px;

    background:#0b0b0b;
    border:1px solid #ff6600;
    border-radius:16px;

    padding:18px;
    margin-bottom:15px;

    text-align:left;

    box-shadow:0 0 10px #ff660018;

    transition:.2s;
}

.achievement:hover{
    transform:translateY(-2px);
    box-shadow:0 0 18px #ff660044;
}

.check{
    width:28px;
    height:28px;
    accent-color:#ff6600;
    cursor:pointer;
    flex-shrink:0;
}

.achievementInfo{
    flex:1;
}

.achievementName{
    color:#ff6600;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.stats{
    color:#aaa;
    font-size:14px;
    line-height:1.5;
}

.people{
    color:#ff8833;
}

.percent{
    color:#ffaa00;
}

.achievement.completed{
    background:#1a1008;
    border-color:#ff6600;
}

.achievement.completed .achievementName{
    text-decoration:line-through;
    opacity:.7;
}

.back{
    display:inline-block;

    margin-top:20px;

    padding:13px 22px;

    background:#ff6600;

    color:#000;

    text-decoration:none;

    font-weight:bold;

    border-radius:10px;
}

.back:hover{
    box-shadow:0 0 18px #ff6600;
}

</style>

</head>


<body>

<h1 id="title">
🔥 Hard
</h1>

</header>


<div class="container">

</p>

class="check"

</div>

class="people"
id="people1">
👥 61 players
</span>

<br>

<span
class="percent"
id="percent1">
📊 30.5%
</span>

</div>

</div>

</div>


<div class="achievement">

<input
type="checkbox"
class="check"
id="achievement2"
onchange="saveAchievement(2)"
>

<div class="achievementInfo">

<div
class="achievementName"
id="name2">

💀 Get 500 kills

</div>

<div class="stats">

<span
class="people"
id="people2">
👥 47 players
</span>

<br>

<span
class="percent"
id="percent2">
📊 23.5%
</span>

</div>

</div>

</div>


<div class="achievement">

<input
type="checkbox"
class="check"
id="achievement3"
onchange="saveAchievement(3)"
>

<div class="achievementInfo">

<div
class="achievementName"
id="name3">

👑 Reach Elite 3

</div>

<div class="stats">

<span
class="people"
id="people3">
👥 38 players
</span>

<br>

<span
class="percent"
id="percent3">
📊 19%
</span>

</div>

</div>

</div>


<div class="achievement">

<input
type="checkbox"
class="check"
id="achievement4"
onchange="saveAchievement(4)"
>

<div class="achievementInfo">

<div
class="achievementName"
id="name4">

🎨 Get all 67 classic skins

</div>

<div class="stats">

<span
class="people"
id="people4">
👥 29 players
</span>

<br>

<span
class="percent"
id="percent4">
📊 14.5%
</span>

</div>

</div>

</div>


<div class="achievement">

type="checkbox"
class="check"
id="achievement5"

>

<div class="achievementInfo">

<div

id="name5">

📅 Play for 7 days in a row

id="people5">

</span>

<span

📊 12%
</span>

</div>

</div>

class="back"
id="back">

🏆 Achievements

</a>


</div>


<script>

/* =========================
   🌐 ПЕРЕВОДЫ
========================= */

const translations = {

en:{

title:"🔥 Hard",

subtitle:"Hard — 5 achievements",

name1:"⬆️ Upgrade a character to level 10",

name2:"💀 Get 500 kills",

name3:"👑 Reach Elite 3",

name4:"🎨 Get all 67 classic skins",

name5:"📅 Play for 7 days in a row",

back:"🏆 Achievements",

players:"players"

},

ru:{

title:"🔥 Хард",

subtitle:"Хард — 5 достижений",

name1:"⬆️ Прокачать персонажа до 10 уровня",

name2:"💀 Сделать 500 убийств",

name3:"👑 Дойти до Элиты 3",

name4:"🎨 Получить все 67 классических скинов",

name5:"📅 Играть 7 дней подряд",

back:"🏆 Достижения",

players:"игроков"

},

uk:{

title:"🔥 Хард",

subtitle:"Хард — 5 досягнень",

name1:"⬆️ Прокачати персонажа до 10 рівня",

name2:"💀 Зробити 500 вбивств",

name3:"👑 Дійти до Еліти 3",

name4:"🎨 Отримати всі 67 класичних скінів",

name5:"📅 Грати 7 днів поспіль",

back:"🏆 Досягнення",

players:"гравців"

}

};


/* =========================
   👥 СТАТИСТИКА
========================= */

const stats = [

[61,30.5],
[47,23.5],
[38,19],
[29,14.5],
[24,12]

];


/* =========================
   🌐 ПОЛУЧАЕМ ЯЗЫК
========================= */

function getLanguage(){

    const saved =
        localStorage.getItem("siteLanguage");

    if(saved === "ru"){
        return "ru";
    }

    if(saved === "uk"){
        return "uk";
    }

    return "en";
}


/* =========================
   🌐 ПРИМЕНЯЕМ ЯЗЫК
========================= */

function applyLanguage(){

    const language = getLanguage();

    const t = translations[language];


    document.getElementById("title")
        .textContent = t.title;


    document.getElementById("subtitle")
        .textContent = t.subtitle;


    for(let i = 1; i <= 5; i++){

        document.getElementById("name" + i)
            .textContent = t["name" + i];


        document.getElementById("people" + i)
            .textContent =
            "👥 " +
            stats[i-1][0] +
            " " +
            t.players;


        document.getElementById("percent" + i)
            .textContent =
            "📊 " +
            stats[i-1][1] +
            "%";

    }


    document.getElementById("back")
        .textContent = t.back;


    document.documentElement.lang =
        language;

}


/* =========================
   ☑️ СОХРАНЕНИЕ
========================= */

function saveAchievement(number){

    const checkbox =
        document.getElementById(
            "achievement" + number
        );


    localStorage.setItem(
        "hardAchievement" + number,
        checkbox.checked
    );


    const card =
        checkbox.closest(".achievement");


    if(checkbox.checked){

        card.classList.add("completed");

    }else{

        card.classList.remove("completed");

    }

}


/* =========================
   ☑️ ЗАГРУЗКА
========================= */

function loadAchievements(){

    for(let i = 1; i <= 5; i++){

        const saved =
            localStorage.getItem(
                "hardAchievement" + i
            );


        const checkbox =
            document.getElementById(
                "achievement" + i
            );


        if(saved === "true"){

            checkbox.checked = true;

            checkbox
                .closest(".achievement")
                .classList.add("completed");

        }

    }

}


/* =========================
   🚀 ЗАПУСК
========================= */

applyLanguage();

loadAchievements();


/*
   Если язык поменяли в Settings,
   а потом вернулись на эту страницу
*/

window.addEventListener(
    "pageshow",
    function(){

        applyLanguage();

        loadAchievements();

    }
);


/*
   Проверяем язык каждые полсекунды.
   Поэтому если Settings поменяет
   localStorage — страница обновит текст.
*/

setInterval(function(){

    applyLanguage();

},500);

</script>


</body>

    </html>
